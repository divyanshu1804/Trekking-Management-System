{% extends "base.html" %}

{% block title %}
Staff Registration
{% endblock %}

{% block content %}

<div class="container py-5">
<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-warning">

                <h3 class="text-center mb-0">
                    Staff Registration
                </h3>

            </div>

            <div class="card-body">

                <p class="text-center text-muted mb-4">
                    Register as a trek staff member and manage trekking activities.
                </p>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               name="phone"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-warning w-100">

                        Register as Staff

                    </button>

                </form>

                <div class="alert alert-warning mt-4">

                    Staff accounts require admin approval before login.

                </div>

                <hr>

                <div class="text-center">

                    <p class="mb-0">

                        Already have an account?

                        <a href="/login">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>
</div>

{% endblock %}
