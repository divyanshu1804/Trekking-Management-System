{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-dark text-white">

                <h3 class="text-center mb-0">
                    Login
                </h3>

            </div>

            <div class="card-body">

                <p class="text-center text-muted mb-4">
                    Sign in to access your trekking account.
                </p>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

                <hr>

                <div class="text-center">

                    <p class="mb-2">

                        New User?

                        <a href="/register-user">
                            Register Here
                        </a>

                    </p>

                    <p class="mb-0">

                        Trek Staff?

                        <a href="/register-staff">
                            Register Here
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</div>

{% endblock %}
