{% extends "base.html" %}

{% block title %}
User Registration
{% endblock %}

{% block content %}

<div class="container py-5">
    
<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-success text-white">

                <h3 class="text-center mb-0">
                    User Registration
                </h3>

            </div>

            <div class="card-body">

                <p class="text-center text-muted mb-4">
                    Create your trekking account and start your adventure.
                </p>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               name="phone"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-success w-100">

                        Register

                    </button>

                </form>

                <hr>

                <div class="text-center">

                    <p class="mb-0">

                        Already have an account?

                        <a href="/login">
                            Login
                        </a>

                    </p>

                    <p class="mb-0">
                        Trek Staff Register?
                        <a href="/register-staff">
                            Register
                        </a>
                        
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</div>

{% endblock %}
