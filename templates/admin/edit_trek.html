{% extends "base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="container py-4">

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-success text-white">

                <h3 class="mb-0">
                    Edit Trek
                </h3>

            </div>

            <div class="card-body">

                <form method="POST" enctype="multipart/form-data">

                    <div class="mb-3">

                        <label class="form-label">
                            Trek Name
                        </label>

                        <input type="text"
                               name="trek_name"
                               class="form-control"
                               value="{{ trek.trek_name }}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input type="text"
                               name="location"
                               class="form-control"
                               value="{{ trek.location }}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Difficulty
                        </label>

                        <select name="difficulty"
                                class="form-select">

                            <option value="Easy"
                                {% if trek.difficulty == 'Easy' %}selected{% endif %}>
                                Easy
                            </option>

                            <option value="Moderate"
                                {% if trek.difficulty == 'Moderate' %}selected{% endif %}>
                                Moderate
                            </option>

                            <option value="Hard"
                                {% if trek.difficulty == 'Hard' %}selected{% endif %}>
                                Hard
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Duration (Days)
                        </label>

                        <input type="number"
                               name="duration"
                               class="form-control"
                               value="{{ trek.duration }}"
                               min="1"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Available Slots
                        </label>

                        <input type="number"
                               name="available_slots"
                               class="form-control"
                               value="{{ trek.available_slots }}"
                               min="0"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Start Date
                        </label>

                        <input type="date"
                               name="start_date"
                               class="form-control"
                               value="{{ trek.start_date }}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            End Date
                        </label>

                        <input type="date"
                               name="end_date"
                               class="form-control"
                               value="{{ trek.end_date }}"
                               required>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Trek Image
                        </label>

                        <input  type="file"
                                name="image"
                                class="form-control"
                                accept="image/*">
                                           
                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea name="description"
                                  class="form-control"
                                  rows="4">{{ trek.description }}</textarea>

                    </div>

                    <div class="d-flex gap-2">

                        <button type="submit"
                                class="btn btn-success">

                            Update Trek

                        </button>

                        <a href="/admin-treks"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</div>

{% endblock %}
