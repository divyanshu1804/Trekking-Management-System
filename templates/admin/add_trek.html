{% extends "base.html" %}

{% block title %}
Add Trek
{% endblock %}

{% block content %}

<div class="row justify-content-center">


<div class="col-md-8">

    <div class="card">

        <div class="card-header">
            <h3>Add New Trek</h3>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Trek Name</label>
                    <input type="text"
                           name="trek_name"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text"
                           name="location"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Difficulty</label>

                    <select name="difficulty"
                            class="form-select">

                        <option value="Easy">Easy</option>
                        <option value="Moderate">Moderate</option>
                        <option value="Hard">Hard</option>

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Duration (Days)</label>

                    <input type="number"
                           name="duration"
                           class="form-control"
                           min="1"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Available Slots</label>

                    <input type="number"
                           name="available_slots"
                           class="form-control"
                           min="0"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Start Date</label>

                    <input type="date"
                           name="start_date"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">End Date</label>

                    <input type="date"
                           name="end_date"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Trek Image
                    </label>

                    <input type="file"
                           name="image" 
                           class="form-control"
                           accept="image/*">

                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea name="description"
                              class="form-control"
                              rows="4"></textarea>
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Add Trek
                </button>

                <a href="/admin-treks"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>


</div>

{% endblock %}
