{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="container py-4">

<div class="mb-4 text-center">

    <h2 class="fw-bold">
        My Profile
    </h2>

    <p class="text-muted">
        Update your account information.
    </p>

</div>

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-dark text-white">

                <h4 class="mb-0">
                    Edit Profile
                </h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input type="text"
                               class="form-control"
                               name="name"
                               value="{{ current_user.name }}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               class="form-control"
                               name="email"
                               value="{{ current_user.email }}"
                               required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               class="form-control"
                               name="phone"
                               value="{{ current_user.phone }}">

                    </div>

                    <div class="d-flex gap-2">

                        <button type="submit"
                                class="btn btn-primary">

                            Update Profile

                        </button>

                        <a href="/user-dashboard"
                           class="btn btn-secondary">

                            Back

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</div>

{% endblock %}
